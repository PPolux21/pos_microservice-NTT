name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/inventory-pos-service

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push on pull requests)
        run: docker build -t app:${{ github.sha }} .
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push (main only, traceable tags)
        if: github.event_name == 'push'
        run: |
          docker tag app:${{ github.sha }} "$IMAGE_NAME:sha-${{ github.sha }}"
          docker tag app:${{ github.sha }} "$IMAGE_NAME:1.0.${{ github.run_number }}"
          docker push "$IMAGE_NAME:sha-${{ github.sha }}"
          docker push "$IMAGE_NAME:1.0.${{ github.run_number }}"
